# v로 시작하는 태그(예: v0.1.0)를 올리면 Windows·macOS·Linux 설치 파일을 만들어
# GitHub Releases 페이지에 자동으로 올립니다.
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # Actions 탭에서 수동 실행 (이때는 Releases 대신 Artifacts로만 올라감)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false # 코드 서명 인증서 없이 빌드
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: 설치 파일 만들기 (macOS·Linux)
        if: runner.os != 'Windows'
        run: npx electron-builder --publish never

      # Windows는 x64와 ARM64를 따로 빌드해야 설치 파일이 각각 나옵니다
      - name: 설치 파일 만들기 (Windows x64)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never

      - name: 설치 파일 만들기 (Windows ARM64)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --arm64 --publish never

      - name: Artifacts로 보관
        uses: actions/upload-artifact@v4
        with:
          name: HangulMathMemo-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore

      - name: Releases에 올리기
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
